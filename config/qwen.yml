# =====================================================================
# Deep Research Agent 配置 —— Qwen (阿里云百炼 / DashScope)
# =====================================================================
stages:
  prod:
    cognition:
      openai:
        base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # 推荐写进 .env 的 QWEN_API_KEY；也可直接替换下方默认值
        api_key: "${QWEN_API_KEY:sk-xxx}"
        default_model: qwen3.8-max
        temperature: 0
        timeout_seconds: 600
        extra_body:
          enable_thinking: false
    search:
      backend: tavily
      tavily:
        # 推荐写进 .env 的 TAVILY_API_KEY；也可直接替换下方默认值
        api_key: "${TAVILY_API_KEY:tvly-xxx}"
        base_url: https://api.tavily.com
        max_results: 3
        topic: general
        include_raw_content: true
        timeout_seconds: 300
    roles:
      supervisor:
        backend: openai
        handle: qwen3.8-max
        max_tokens: 131072
        timeout_seconds: 600
      red_team:
        backend: openai
        handle: qwen3.8-max
        max_tokens: 131072
        timeout_seconds: 600
      researcher_main:
        backend: openai
        handle: qwen3.8-max
        max_tokens: 131072
        timeout_seconds: 600
      researcher_summarizer:
        backend: openai
        handle: qwen3.8-flash
        max_tokens: 131072
        timeout_seconds: 600
      researcher_compressor:
        backend: openai
        handle: qwen3.8-flash
        max_tokens: 131072
        timeout_seconds: 600
      writer:
        backend: openai
        handle: qwen3.8-max
        max_tokens: 131072
        timeout_seconds: 600
      draft:
        backend: openai
        handle: qwen3.8-max
        max_tokens: 131072
        timeout_seconds: 600
      evaluator:
        backend: openai
        handle: qwen3.8-flash
        max_tokens: 131072
        timeout_seconds: 600
