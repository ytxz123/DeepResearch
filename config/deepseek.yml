# =====================================================================
# Deep Research Agent 配置 —— DeepSeek (OpenAI 兼容接口)
#   python run.py "你的调研问题"
#   官方文档: https://api-docs.deepseek.com/
# =====================================================================
stages:
  prod:
    cognition:
      openai:
        base_url: https://api.deepseek.com
        # 推荐写进 .env 的 DEEPSEEK_API_KEY；也可直接替换下方默认值
        api_key: "${DEEPSEEK_API_KEY:sk-xxx}"
        default_model: deepseek-flash
        temperature: 0
        timeout_seconds: 900
        # DeepSeek 不支持 langchain 默认的 json_schema（会报
        # "This response_format type is unavailable now"），需改用 json_mode。
        structured_output_method: json_mode
    search:
      backend: tavily
      tavily:
        # 推荐写进 .env 的 TAVILY_API_KEY；也可直接替换下方默认值
        api_key: "${TAVILY_API_KEY:tvly-xxx}"
        base_url: https://api.tavily.com
        # 单次搜索返回的结果数。每条结果消耗 1 次检索额度，并各送一次摘要调用
        max_results: 4
        topic: general
        include_raw_content: true
        timeout_seconds: 300
    roles:
      # 各角色统一使用 deepseek-flash。
      #
      # 这里刻意不设 max_tokens：
      #   1. langchain 把它发成 max_completion_tokens，而 DeepSeek 只认 max_tokens，
      #      设了也不生效；
      #   2. 真要让它生效需走 extra_body 绕路，而 DeepSeek 模型是思考模型、思维链
      #      同样计入上限，撞限时返回的是空正文而非截断正文——对调研是负收益。
      # 实测各角色输出均在 2 万 token 内自然收尾，交由服务端上限兜底即可。
      supervisor:
        backend: openai
        handle: deepseek-flash
        timeout_seconds: 900
      red_team:
        backend: openai
        handle: deepseek-flash
        timeout_seconds: 600
      researcher_main:
        backend: openai
        handle: deepseek-flash
        timeout_seconds: 600
      researcher_summarizer:
        backend: openai
        handle: deepseek-flash
        timeout_seconds: 600
      researcher_compressor:
        backend: openai
        handle: deepseek-flash
        timeout_seconds: 900
      writer:
        backend: openai
        handle: deepseek-flash
        timeout_seconds: 900
      draft:
        backend: openai
        handle: deepseek-flash
        timeout_seconds: 900
      evaluator:
        backend: openai
        handle: deepseek-flash
        timeout_seconds: 600
