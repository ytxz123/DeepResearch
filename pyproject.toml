[project]
name = "deep-research"
version = "0.1.0"
description = "基于 LangGraph + LangChain 的多智能体深度调研系统，自动产出带引用的调研报告"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "ytxz123" }]
keywords = ["deep-research", "multi-agent", "langgraph", "langchain", "llm", "agent", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain>=1.2.0",
    "langchain-core>=1.2.5",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "nest-asyncio>=1.6.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "tavily-python>=0.7.17",
    "typing-extensions>=4.15.0",
]
